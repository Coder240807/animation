<body>
    <canvas id="canvas"></canvas>

    <button id="startBtn" style="
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 14px 32px;

        cursor: pointer;
    "> Start Game

    <button id="restartBtn" style ="
    display: none;
    position: absolute;

    left: 50%;
    transform:translate(-50%, 40px);
    padding: 12px 28px;
    font-size: 20px;
    cursor: pointer;
    "> RESTART </button>
</body>
